<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1d3557"/>
      <stop offset="0.55" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f7ff"/>
      <stop offset="0.5" stop-color="#8fd3fe"/>
      <stop offset="1" stop-color="#5aa9f7"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be7ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9be7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  </g>
  <g clip-path="url(#squircle)">
    <!-- ice facets -->
    <polygon points="100,100 560,100 330,420" fill="url(#facet)"/>
    <polygon points="924,180 924,560 700,330" fill="url(#facet)" opacity="0.7"/>
    <polygon points="560,100 924,100 924,180 700,330" fill="#9be7ff" opacity="0.06"/>
    <polygon points="100,640 330,420 100,924" fill="#9be7ff" opacity="0.05"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- prompt -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="290,370 470,512 290,654" stroke="url(#ice)" stroke-width="64"/>
    <line x1="530" y1="654" x2="730" y2="654" stroke="#e0f7ff" stroke-width="58" opacity="0.9"/>
  </g>
  <!-- snowflake spark -->
  <g transform="translate(724 324)" stroke="#e0f7ff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9">
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-62"/>
      <polyline points="-18,-46 0,-30 18,-46"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>
</svg>
